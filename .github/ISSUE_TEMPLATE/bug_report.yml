name: Bug report
description: Report reproducible BurpNexus behavior without sensitive target data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private source, customer traffic, or undisclosed vulnerabilities. Use SECURITY.md for security reports.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Burp Java extension
        - VS Code extension
        - Python CLI
        - Documentation or release workflow
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "VSIX 1.1.0 / JAR 1.1.0 / CLI 1.1.0"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS and relevant Burp, VS Code, Java, Node, or Python versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic/redacted data. Include commands and expected/actual behavior.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or indexing warnings
      render: text
  - type: checkboxes
    id: safety
    attributes:
      label: Data check
      options:
        - label: I removed credentials, private source, customer traffic, and other sensitive data.
          required: true
