plugins {
    id 'java'
}

group = 'com.burpnexus'
version = '1.1.0'

// Keep review builds separate from IDE-owned class output.
layout.buildDirectory = file(providers.gradleProperty('outputDir').getOrElse('build/release'))

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2023.12.1'
    implementation 'com.google.code.gson:gson:2.13.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'net.portswigger.burp.extensions:montoya-api:2023.12.1'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
test {
    useJUnitPlatform()
    systemProperty 'nexus.contractDir', layout.buildDirectory.dir('contract-export').get().asFile.absolutePath
}

tasks.named('jar') {
    archiveBaseName = 'burpnexus'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    manifest {
        attributes(
            'Implementation-Title': 'BurpNexus',
            'Implementation-Version': project.version
        )
    }
}
